<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64">
  <!-- Vanity SOL GPU: the Solana mark on a GPU die. Used for the page header and app icons.
       icon-small.svg is the pixel-aligned cut used for favicons.
       PNG icons are generated from this file: npm run images -->
  <defs>
    <linearGradient id="vs-tile" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#22143f"/>
      <stop offset="1" stop-color="#0a0a17"/>
    </linearGradient>
    <linearGradient id="vs-die" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#9945ff"/>
      <stop offset=".55" stop-color="#5b6fe8"/>
      <stop offset="1" stop-color="#14c58a"/>
    </linearGradient>
    <linearGradient id="vs-pin" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#b98cff"/>
      <stop offset="1" stop-color="#3ee8a8"/>
    </linearGradient>
  </defs>
  <rect class="tile" width="64" height="64" rx="14" fill="url(#vs-tile)"/>
  <g fill="url(#vs-pin)">
    <rect x="20.75" y="5" width="2.5" height="6" rx="1.25"/>
    <rect x="20.75" y="53" width="2.5" height="6" rx="1.25"/>
    <rect x="5" y="20.75" width="6" height="2.5" rx="1.25"/>
    <rect x="53" y="20.75" width="6" height="2.5" rx="1.25"/>
    <rect x="30.75" y="5" width="2.5" height="6" rx="1.25"/>
    <rect x="30.75" y="53" width="2.5" height="6" rx="1.25"/>
    <rect x="5" y="30.75" width="6" height="2.5" rx="1.25"/>
    <rect x="53" y="30.75" width="6" height="2.5" rx="1.25"/>
    <rect x="40.75" y="5" width="2.5" height="6" rx="1.25"/>
    <rect x="40.75" y="53" width="2.5" height="6" rx="1.25"/>
    <rect x="5" y="40.75" width="6" height="2.5" rx="1.25"/>
    <rect x="53" y="40.75" width="6" height="2.5" rx="1.25"/>
  </g>
  <rect x="11" y="11" width="42" height="42" rx="8" fill="url(#vs-die)"/>
  <rect x="11.75" y="11.75" width="40.5" height="40.5" rx="7.25" fill="none" stroke="#fff" stroke-opacity=".22" stroke-width="1.5"/>
  <g fill="#fff">
    <polygon points="23.5,20.5 46,20.5 40.5,26 18,26"/>
    <polygon points="18,29.25 40.5,29.25 46,34.75 23.5,34.75" fill-opacity=".8"/>
    <polygon points="23.5,38 46,38 40.5,43.5 18,43.5" fill-opacity=".92"/>
  </g>
</svg>
