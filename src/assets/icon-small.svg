<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64">
  <!-- Vanity SOL GPU: the Solana mark on a GPU die. Favicon cut: two pins per side and
       thicker bars stay crisp at 16 px. Geometry sits on a 4-unit grid so edges land on
       whole pixels at 16/32 px. PNG icons are generated from this file: npm run images -->
  <defs>
    <linearGradient id="vs-tile" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#22143f"/>
      <stop offset="1" stop-color="#0a0a17"/>
    </linearGradient>
    <linearGradient id="vs-die" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#9945ff"/>
      <stop offset=".55" stop-color="#5b6fe8"/>
      <stop offset="1" stop-color="#14c58a"/>
    </linearGradient>
    <linearGradient id="vs-pin" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#b98cff"/>
      <stop offset="1" stop-color="#3ee8a8"/>
    </linearGradient>
  </defs>
  <rect class="tile" width="64" height="64" rx="14" fill="url(#vs-tile)"/>
  <g fill="url(#vs-pin)">
    <rect x="20" y="4" width="4" height="8" rx="2"/>
    <rect x="20" y="52" width="4" height="8" rx="2"/>
    <rect x="4" y="20" width="8" height="4" rx="2"/>
    <rect x="52" y="20" width="8" height="4" rx="2"/>
    <rect x="40" y="4" width="4" height="8" rx="2"/>
    <rect x="40" y="52" width="4" height="8" rx="2"/>
    <rect x="4" y="40" width="8" height="4" rx="2"/>
    <rect x="52" y="40" width="8" height="4" rx="2"/>
  </g>
  <rect x="12" y="12" width="40" height="40" rx="8" fill="url(#vs-die)"/>
  <rect x="12.75" y="12.75" width="38.5" height="38.5" rx="7.25" fill="none" stroke="#fff" stroke-opacity=".22" stroke-width="1.5"/>
  <g fill="#fff">
    <polygon points="22,18 46,18 42,24 18,24"/>
    <polygon points="18,29 42,29 46,35 22,35" fill-opacity=".85"/>
    <polygon points="22,40 46,40 42,46 18,46" fill-opacity=".95"/>
  </g>
</svg>
